<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江西战区人力成本分析看板 · 离线版</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f0f5f4;--card:#fff;--border:#c8d8d6;--primary:#00726D;--primary-light:#e0f2f0;--primary-dark:#002D28;--fixed-color:#00726D;--perf-color:#CEA472;--green:#16a34a;--green-bg:#dcfce7;--red:#dc2626;--red-bg:#fee2e2;--orange:#d97706;--orange-bg:#fef3c7;--gold:#CEA472;--gold-bg:#fdf5eb;--gray:#666;--text:#333;--sub:#666}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:19px;font-weight:700}
.header .sub-info{font-size:11px;opacity:.8;margin-top:2px}
.period-select{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.period-select option{color:#333;background:#fff}
.tabs-container{padding:12px 20px 0}
.tab-nav{display:flex;gap:2px;border-bottom:2px solid var(--border)}
.tab-btn{padding:8px 18px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--gray);border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:6px 6px 0 0;transition:all .15s}
.tab-btn:hover{background:var(--primary-light);color:var(--primary)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-light)}
.tab-panel{display:none;padding:14px 0 24px}.tab-panel.active{display:block}
.filter-bar{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-bar label{font-size:11px;color:var(--gray);font-weight:600;white-space:nowrap}
.filter-select{padding:5px 10px;border-radius:6px;border:1px solid var(--border);font-size:12px;background:#f8fafc;color:var(--text);cursor:pointer;min-width:110px}
.filter-sep{width:1px;height:22px;background:var(--border)}
.filter-clear{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;color:var(--gray)}
.filter-clear:hover{color:var(--red);border-color:var(--red)}
.filter-count{font-size:11px;color:var(--gray);margin-left:auto}
.ms-wrap{position:relative}
.ms-trigger{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);font-size:12px;background:#f8fafc;color:var(--text);cursor:pointer;min-width:130px;user-select:none;white-space:nowrap}
.ms-trigger svg{margin-left:auto;flex-shrink:0;transition:transform .15s}
.ms-trigger.open svg{transform:rotate(180deg)}
.ms-panel{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.13);z-index:200;min-width:190px;display:none;flex-direction:column}
.ms-panel.open{display:flex}
.ms-search-box{padding:7px 10px;border-bottom:1px solid var(--border)}
.ms-search-box input{width:100%;border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:12px;outline:none}
.ms-all-row{padding:6px 12px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.ms-all-row:hover{background:var(--primary-light)}
.ms-list{overflow-y:auto;max-height:210px}
.ms-item{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:12px;cursor:pointer}
.ms-item:hover{background:var(--primary-light)}
.ms-item input,.ms-all-row input{accent-color:var(--primary);cursor:pointer}
.ms-count-badge{background:var(--primary);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px}
.intern-tag{font-size:9px;color:var(--gray);margin-left:2px;cursor:help;white-space:nowrap}
.section-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.section-title::before{content:'';width:3px;height:13px;background:var(--primary);border-radius:2px;display:inline-block}
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:14px;margin-bottom:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.summary-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.summary-card{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);border-top:3px solid var(--primary)}
.summary-card.green{border-top-color:var(--green)}.summary-card.orange{border-top-color:var(--orange)}
.summary-card .s-label{font-size:10px;color:var(--gray)}
.summary-card .s-val{font-size:18px;font-weight:700}
.summary-card .s-sub{font-size:10px;color:var(--sub);margin-top:2px}
.chart-box{position:relative}
.chart-legend{display:flex;gap:16px;margin-bottom:6px;font-size:11px;color:var(--gray)}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:9px;height:9px;border-radius:3px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:#f8fafc;color:var(--gray);font-weight:600;padding:8px 9px;text-align:center;border-bottom:2px solid var(--border);white-space:nowrap}
thead th:first-child{text-align:left}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{background:#eef2f1;color:var(--primary)}
.sort-indicator{font-size:10px;margin-left:3px;display:inline-block;width:14px;text-align:center;color:#bbb}
.sort-indicator.active{color:var(--primary)}
tbody tr:hover{background:#f8fafc}
tbody td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
tbody td:first-child{text-align:left;font-weight:600}
tbody tr:last-child td{border-bottom:none}
.total-row td{font-weight:700;background:#f0f9ff;color:var(--primary-dark)}
.no-data{text-align:center;padding:24px;color:var(--gray);font-size:12px}
.notice{background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:12px;color:#92400e}
.ratio-bar{display:flex;height:13px;border-radius:3px;overflow:hidden;min-width:65px;gap:1px}
.ratio-fixed{background:var(--fixed-color)}.ratio-perf{background:var(--perf-color)}
.rate{display:inline-block;padding:2px 8px;border-radius:10px;font-weight:700;font-size:11px}
.rate-good{background:var(--green-bg);color:var(--green)}.rate-mid{background:var(--orange-bg);color:var(--orange)}.rate-bad{background:var(--red-bg);color:var(--red)}
.export-btn{display:flex;align-items:center;gap:4px;margin-left:auto;padding:4px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--gray);background:#f8fafc}
.export-btn:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-light)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="header">
  <div><h1>江西战区人力成本分析看板</h1><div class="sub-info">离线版 · 数据含 1月~4月</div></div>
  <select class="period-select" id="periodSelect" onchange="switchPeriod(this.value)">
    <option value="2026-01">2026年1月</option><option value="2026-02">2026年2月</option><option value="2026-03">2026年3月</option><option value="2026-04">2026年4月</option>
  </select>
</div>

<div class="tabs-container">
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('overview')">综合概览</button>
    <button class="tab-btn" onclick="switchTab('retail')">零售明细</button>
    <button class="tab-btn" onclick="switchTab('personnel')">人员明细</button>
  </div>

  <!-- ===== OVERVIEW ===== -->
  <div class="tab-panel active" id="tab-overview">
    <div class="grid-2">
      <div class="card">
        <div class="section-title">零售 vs 交付 固浮比对比</div>
        <div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:var(--fixed-color)"></div>固定成本</div><div class="legend-item"><div class="legend-dot" style="background:var(--perf-color)"></div>绩效成本</div></div>
        <div class="chart-box" style="height:190px"><canvas id="chartFixedPerf"></canvas></div>
        <div style="margin-top:8px;font-size:11px;color:var(--gray)">※ 基准固浮比建议：固定40% / 绩效60%</div>
      </div>
      <div class="card">
        <div class="section-title">战区成本结构占比</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;height:190px">
          <div class="chart-box"><canvas id="chartPie1"></canvas></div>
          <div class="chart-box"><canvas id="chartPie2"></canvas></div>
        </div>
        <div style="display:flex;justify-content:space-around;font-size:11px;color:var(--gray);margin-top:6px"><span>零售 vs 交付</span><span>固定 vs 绩效</span></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">战区分模块成本汇总</div>
      <div class="table-wrap"><table><thead><tr><th>模块</th><th>人数</th><th>本月人工成本</th><th>上月人工成本</th><th>环比</th><th>固定成本</th><th>绩效成本</th><th>固浮比</th><th>人均总成本</th></tr></thead><tbody id="overviewTbody"></tbody></table></div>
    </div>
    <div class="grid-2">
      <div class="card"><div class="section-title">门店定单达成分析</div><div class="chart-box" style="height:300px"><canvas id="chartOrderRate"></canvas></div></div>
      <div class="card"><div class="section-title">人均总成本分布</div><div class="chart-box" style="height:300px"><canvas id="chartCostDist"></canvas></div></div>
    </div>
    <div class="card"><div class="section-title">人效 vs 人均总成本 · 四象限分析</div><div class="chart-box" style="height:420px"><canvas id="chartEffCost"></canvas></div><div id="quadrantSummary"></div></div>
  </div>

  <!-- ===== RETAIL ===== -->
  <div class="tab-panel" id="tab-retail">
    <div class="filter-bar">
      <label>所属部门</label>
      <select class="filter-select" id="rFilterDept" onchange="applyRetailFilters()"><option value="">全部</option></select>
      <div class="filter-sep"></div>
      <label>门店</label>
      <div class="ms-wrap">
        <div class="ms-trigger" id="rMsTrigger" onclick="rToggleMsPanel()"><span id="rMsLabel">全部门店</span><svg viewBox="0 0 10 6" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg></div>
        <div class="ms-panel" id="rMsPanel">
          <div class="ms-search-box"><input type="text" placeholder="搜索门店…" id="rMsSearch" oninput="rFilterMsOptions(this.value)"></div>
          <label class="ms-all-row"><input type="checkbox" id="rMsSelectAll" onchange="rMsToggleAll(this)"> 全选</label>
          <div class="ms-list" id="rMsList"></div>
        </div>
      </div>
      <div class="filter-sep"></div>
      <label>达成状态</label>
      <select class="filter-select" id="rFilterRate" onchange="applyRetailFilters()" style="min-width:100px"><option value="">全部</option><option value="exceed">超额完成 ≥100%</option><option value="good">达标 85-100%</option><option value="mid">偏低 70-85%</option><option value="low">未达标 &lt;70%</option></select>
      <button class="filter-clear" onclick="clearRetailFilters()">清除筛选</button>
      <span class="filter-count" id="rFilterCount"></span>
    </div>
    <div class="summary-row" id="retailSummaryRow"></div>
    <div class="notice" id="retailNotice"></div>
    <div class="card">
      <div class="section-title" id="retailTableTitle">零售门店综合分析<button class="export-btn" onclick="exportRetailTable()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出 Excel</button></div>
      <div class="table-wrap"><table><thead id="retailThead"></thead><tbody id="retailTbody"></tbody></table></div>
    </div>
    <div class="card">
      <div class="section-title">补充成本明细（含环比）<button class="export-btn" onclick="exportCostTable()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出 Excel</button></div>
      <div class="table-wrap"><table><thead id="costThead"></thead><tbody id="costTbody"></tbody></table></div>
    </div>
  </div>

  <!-- ===== PERSONNEL ===== -->
  <div class="tab-panel" id="tab-personnel">
    <div class="filter-bar">
      <label>所属部门</label>
      <select class="filter-select" id="pFilterDept" onchange="popPersonnelDeptChange()"><option value="">全部</option></select>
      <div class="filter-sep"></div>
      <label>门店</label>
      <div class="ms-wrap">
        <div class="ms-trigger" id="pMsTrigger" onclick="pToggleMsPanel()"><span id="pMsLabel">全部门店</span><svg viewBox="0 0 10 6" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg></div>
        <div class="ms-panel" id="pMsPanel">
          <div class="ms-search-box"><input type="text" placeholder="搜索门店…" id="pMsSearch" oninput="pFilterMsOptions(this.value)"></div>
          <label class="ms-all-row"><input type="checkbox" id="pMsSelectAll" onchange="pMsToggleAll(this)"> 全选</label>
          <div class="ms-list" id="pMsList"></div>
        </div>
      </div>
      <div class="filter-sep"></div>
      <label>岗位</label>
      <div class="ms-wrap">
        <div class="ms-trigger" id="pTitleMsTrigger" onclick="pToggleTitleMsPanel()"><span id="pTitleMsLabel">全部岗位</span><svg viewBox="0 0 10 6" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg></div>
        <div class="ms-panel" id="pTitleMsPanel">
          <div class="ms-search-box"><input type="text" placeholder="搜索岗位…" id="pTitleMsSearch" oninput="pFilterTitleMsOptions(this.value)"></div>
          <label class="ms-all-row"><input type="checkbox" id="pTitleMsSelectAll" onchange="pTitleMsToggleAll(this)"> 全选</label>
          <div class="ms-list" id="pTitleMsList"></div>
        </div>
      </div>
      <button class="filter-clear" onclick="clearPersonnelFilters()">清除筛选</button>
      <span style="margin-left:auto;font-size:11px;color:var(--gray)" id="pCountInfo"></span>
    </div>
    <div class="card"><div class="section-title">个人成本 vs 定单量 四象限分析</div><div class="chart-box" style="height:400px"><canvas id="chartPersonnel"></canvas></div></div>
    <div id="personnelQuadrantSummary"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

var ALL_PERIODS = ["2026-01","2026-02","2026-03","2026-04"];

// ======= STATE =======
var currentPeriod = ALL_PERIODS[ALL_PERIODS.length-1];
var charts = {};

function getData() { return ALL_DATA[currentPeriod]; }
function getPrevData() { var idx = ALL_PERIODS.indexOf(currentPeriod); if(idx < ALL_PERIODS.length-1) return ALL_DATA[ALL_PERIODS[idx+1]]; return null; }
function fmt(n) { return (n||0).toLocaleString('zh-CN'); }
function median(arr) { if(!arr.length) return 0; var s = [].concat(arr).sort(function(a,b){return a-b;}); var m = Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
function destroyChart(id) { if(charts[id]) { charts[id].destroy(); delete charts[id]; } }
function showToast(msg) { var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2500); }
function rateClass(r) { if(r>=1) return 'rate rate-good'; if(r>=0.85) return 'rate rate-mid'; return 'rate rate-bad'; }
function fixedBadge(fp) { if(fp>=50) return '<span class="rate rate-bad">'+fp+'%</span>'; if(fp>=40) return '<span class="rate rate-mid">'+fp+'%</span>'; return '<span class="rate rate-good">'+fp+'%</span>'; }
function momBadge(cur, prev) { if(!prev) return '<span style="color:var(--gray);font-size:10px">—</span>'; var pct = (cur-prev)/prev*100; if(pct<0) return '<span style="color:var(--green);font-weight:600">▼ '+Math.abs(pct).toFixed(1)+'%</span>'; if(pct>0) return '<span style="color:var(--red);font-weight:600">▲ '+pct.toFixed(1)+'%</span>'; return '<span style="color:var(--gray)">0%</span>'; }
function addExportHeaderStyle(ws) { var range = XLSX.utils.decode_range(ws['!ref']); for(var C=range.s.c; C<=range.e.c; C++) { var cell = ws[XLSX.utils.encode_cell({r:0,c:C})]; if(cell) cell.s = { font:{ bold:true }, fill:{ fgColor:{ rgb:'002D28' } } }; } }

function switchPeriod(ym) { currentPeriod = ym; renderAll(); }

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(function(b,i){ var ids=['overview','retail','personnel']; b.classList.toggle('active', ids[i]===id); });
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.style.display='none'; });
  document.getElementById('tab-'+id).style.display='block';
  renderAll();
}

// ======= RENDER ALL =======
function renderAll() {
  destroyChart('chartFixedPerf'); destroyChart('chartPie1'); destroyChart('chartPie2');
  destroyChart('chartOrderRate'); destroyChart('chartCostDist'); destroyChart('chartEffCost');
  destroyChart('chartPersonnel');
  renderOverview();
  renderRetail();
  renderPersonnel();
}

// ======= OVERVIEW =======
function renderOverview() {
  var d = getData(), prev = getPrevData();
  if(!d) return;
  var rs = d.retailStores||[], sp = d.supportDepts||[], ds = d.deliveryStores||[], dsup = d.deliverySupport||[];
  var all = [].concat(rs, sp, ds, dsup);
  var totalLabor=0, totalFixed=0, totalPerf=0;
  all.forEach(function(s){ totalLabor+=s.labor||0; totalFixed+=s.fixed||0; totalPerf+=s.perf||0; });

  function sum(arr,f){return arr.reduce(function(a,s){return a+(s[f]||0);},0);}
  var retailLabor = sum(rs,'labor'), deliveryLabor = sum(ds,'labor');

  charts.chartFixedPerf = new Chart(document.getElementById('chartFixedPerf'), {
    type:'bar', data:{labels:['零售','交付'], datasets:[
      {label:'固定成本',data:[sum(rs,'fixed'),sum(ds,'fixed')],backgroundColor:'#00726D',borderRadius:3},
      {label:'绩效成本',data:[sum(rs,'perf'),sum(ds,'perf')],backgroundColor:'#CEA472',borderRadius:3}
    ]}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}},scales:{x:{grid:{display:false}},y:{ticks:{callback:function(v){return (v/10000).toFixed(1)+'万';}}}}}
  });

  charts.chartPie1 = new Chart(document.getElementById('chartPie1'), {type:'doughnut',data:{labels:['零售','交付'],datasets:[{data:[retailLabor,deliveryLabor],backgroundColor:['#00726D','#CEA472'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'65%'}});
  charts.chartPie2 = new Chart(document.getElementById('chartPie2'), {type:'doughnut',data:{labels:['固定成本','绩效成本'],datasets:[{data:[totalFixed,totalPerf],backgroundColor:['#00726D','#CEA472'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'65%'}});

  // Overview table
  var modules = [
    {name:'零售门店', key:'retailStores'}, {name:'战区支持', key:'supportDepts'},
    {name:'交付中心', key:'deliveryStores'}, {name:'交付支持', key:'deliverySupport'}
  ];
  var tbody='', tot={count:0,labor:0,fixed:0,perf:0,prevLabor:0};
  modules.forEach(function(mod){
    var arr=d[mod.key]||[], parr=prev?(prev[mod.key]||[]):[];
    var c=0,lab=0,fix=0,perf=0,pLab=0;
    arr.forEach(function(s){c+=s.count||0;lab+=s.labor||0;fix+=s.fixed||0;perf+=s.perf||0;});
    parr.forEach(function(s){pLab+=s.labor||0;});
    tot.count+=c;tot.labor+=lab;tot.fixed+=fix;tot.perf+=perf;tot.prevLabor+=pLab;
    var fp=lab>0?(fix/lab*100).toFixed(1):'-';
    var mom=pLab?momBadge(lab,pLab):'<span style="color:var(--gray);font-size:10px">—</span>';
    var avgP=c>0?Math.round(lab/c):'-';
    tbody+='<tr><td>'+mod.name+'</td><td>'+c+'</td><td>'+fmt(lab)+'</td><td>'+fmt(pLab)+'</td><td>'+mom+'</td><td style="color:var(--fixed-color)">'+fmt(fix)+'</td><td style="color:var(--perf-color)">'+fmt(perf)+'</td><td>'+fp+'%</td><td>'+fmt(avgP)+'</td></tr>';
  });
  var ofp=tot.labor>0?(tot.fixed/tot.labor*100).toFixed(1):'-';
  var omom=tot.prevLabor?momBadge(tot.labor,tot.prevLabor):'<span style="color:var(--gray);font-size:10px">—</span>';
  tbody+='<tr class="total-row"><td>合计</td><td>'+tot.count+'</td><td>'+fmt(tot.labor)+'</td><td>'+fmt(tot.prevLabor)+'</td><td>'+omom+'</td><td>'+fmt(tot.fixed)+'</td><td>'+fmt(tot.perf)+'</td><td>'+ofp+'%</td><td>'+(tot.count>0?fmt(Math.round(tot.labor/tot.count)):'-')+'</td></tr>';
  document.getElementById('overviewTbody').innerHTML = tbody;

  // Retail charts in overview
  renderOverviewCharts(rs);
}

function renderOverviewCharts(arr) {
  if(!arr||!arr.length) return;

  var qp={id:'q',afterDraw:function(ch){var c=ch.ctx,l=ch.chartArea.left,r=ch.chartArea.right,t=ch.chartArea.top,b=ch.chartArea.bottom,x=ch.scales.x,y=ch.scales.y,px=x.getPixelForValue(mx),py=y.getPixelForValue(my);c.save();[[l,t,px-l,py-t,1],[px,t,r-px,py-t,2],[l,py,px-l,b-py,3],[px,py,r-px,b-py,4]].forEach(function(a){c.fillStyle=Q[a[4]].ab;c.fillRect(a[0],a[1],a[2],a[3]);});c.strokeStyle='#bbb';c.lineWidth=1;c.setLineDash([5,4]);c.beginPath();c.moveTo(px,t);c.lineTo(px,b);c.stroke();c.beginPath();c.moveTo(l,py);c.lineTo(r,py);c.stroke();c.setLineDash([]);c.font='10px sans-serif';c.fillStyle='#999';c.textAlign='center';c.fillText('中位 '+(mx/10000).toFixed(1)+'万',px,b+22);c.textAlign='right';c.fillText('中位 '+my,l-4,py+4);c.font='bold 10px PingFang SC,sans-serif';[[Q[1].label,l+5,t+13,'left','rgba(0,114,109,0.75)'],[Q[2].label,r-5,t+13,'right','rgba(160,100,30,0.75)'],[Q[3].label,l+5,b-6,'left','rgba(60,100,150,0.65)'],[Q[4].label,r-5,b-6,'right','rgba(180,30,30,0.75)']].forEach(function(a){c.fillStyle=a[4];c.textAlign=a[3];c.fillText(a[0],a[1],a[2]);});c.restore();}};
  var labelPlugin=createRetailLabelPlugin();

  var defs=[{q:1,ic:'⭐',ti:'低成本·高人效',de:'成本控制好且人效突出，是当前的标杆门店，可作为经验推广参考。',co:'#00726D',bg:'rgba(0,114,109,0.06)',bo:'rgba(0,114,109,0.2)'},{q:2,ic:'📈',ti:'高成本·高人效',de:'人效表现出色但成本偏高，建议深挖成本结构，优化固浮比或人员配置。',co:'#9a6c20',bg:'rgba(206,164,114,0.1)',bo:'rgba(180,130,50,0.35)'},{q:3,ic:'⚡',ti:'低成本·低人效',de:'成本可控，但单量产出不足，建议聚焦订单获取能力及员工激励机制。',co:'#3a6898',bg:'rgba(82,120,160,0.07)',bo:'rgba(82,120,160,0.25)'},{q:4,ic:'⚠️',ti:'高成本·低人效',de:'高投入低产出，需重点排查人员结构及运营效率，优先制定改善方案。',co:'#dc2626',bg:'rgba(220,38,38,0.06)',bo:'rgba(220,38,38,0.2)'}];

// ======= RETAIL =======
function getRetailData() { return getData().retailStores||[]; }
function rGetMsSelected(){return [...document.querySelectorAll('#rMsList input[type=checkbox]:checked')].map(function(cb){return cb.value;});}
function rMsSyncLabel(){var s=rGetMsSelected(),l=document.getElementById('rMsLabel');if(!s.length)l.textContent='全部门店';else if(s.length===1)l.textContent=s[0];else l.innerHTML='已选 <span class="ms-count-badge">'+s.length+'</span> 家门店';}
function rMsSyncSelectAll(){var a=document.querySelectorAll('#rMsList input'),c=document.querySelectorAll('#rMsList input:checked'),sa=document.getElementById('rMsSelectAll');sa.indeterminate=c.length>0&&c.length<a.length;sa.checked=a.length>0&&c.length===a.length;}
function rToggleMsPanel(){var p=document.getElementById('rMsPanel'),t=document.getElementById('rMsTrigger'),o=p.classList.toggle('open');t.classList.toggle('open',o);if(o){document.getElementById('rMsSearch').value='';rFilterMsOptions('');document.getElementById('rMsSearch').focus();}}
function rCloseMsPanel(){document.getElementById('rMsPanel').classList.remove('open');document.getElementById('rMsTrigger').classList.remove('open');}
function rFilterMsOptions(q){q=q.toLowerCase();document.querySelectorAll('#rMsList .ms-item').forEach(function(i){i.style.display=!q||i.dataset.name.toLowerCase().includes(q)?'':'none';});}
function rMsToggleAll(cb){document.querySelectorAll('#rMsList input').forEach(function(c){c.checked=cb.checked;});rMsSyncLabel();rMsSyncSelectAll();applyRetailFilters();}
function rPopulateDropdown(){var dept=document.getElementById('rFilterDept').value;var stores=getRetailData().filter(function(s){if(dept&&s.dept!==dept)return false;return true;}).map(function(s){return s.name;}).filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(a,b){return a.localeCompare(b,'zh');});var prev=rGetMsSelected().filter(function(n){return stores.includes(n);});document.getElementById('rMsList').innerHTML=stores.map(function(n){return '<label class="ms-item" data-name="'+n+'"><input type="checkbox" value="'+n+'" onchange="rMsSyncLabel();rMsSyncSelectAll();applyRetailFilters()"'+(prev.includes(n)?' checked':'')+'> '+n+'</label>';}).join('');rMsSyncLabel();rMsSyncSelectAll();}
document.addEventListener('click',function(e){var w=document.getElementById('rMsPanel')?.parentElement;if(w&&!w.contains(e.target))rCloseMsPanel();});

function initRetailFilters() {
  var stores = getRetailData();
  var depts = [...new Set(stores.filter(function(s){return s.dept;}).map(function(s){return s.dept;}))].sort(function(a,b){return a.localeCompare(b,'zh');});
  document.getElementById('rFilterDept').innerHTML = '<option value="">全部</option>'+depts.map(function(d){return '<option value="'+d+'">'+d+'</option>';}).join('');
  rPopulateDropdown();
  applyRetailFilters();
}

function clearRetailFilters() { document.getElementById('rFilterDept').value='';document.getElementById('rFilterRate').value='';rPopulateDropdown();applyRetailFilters(); }

function applyRetailFilters() {
  var dept=document.getElementById('rFilterDept').value, stores=rGetMsSelected(), rate=document.getElementById('rFilterRate').value;
  var filtered = getRetailData().filter(function(s){ if(dept&&s.dept!==dept)return false; if(stores.length&&!stores.includes(s.name))return false; if(rate){var r=s.orders_actual!=null&&s.orders_target>0?s.orders_actual/s.orders_target:null;if(r===null)return false;if(rate==='exceed'&&r<1)return false;if(rate==='good'&&(r<0.85||r>=1))return false;if(rate==='mid'&&(r<0.7||r>=0.85))return false;if(rate==='low'&&r>=0.7)return false;} return true; });
  document.getElementById('rFilterCount').textContent = filtered.length+'/'+getRetailData().length+'家';
  renderRetailTable(filtered);
}

function renderRetailTable(sorted) {
  var prev = getPrevData(); var psMap = {}; if(prev&&prev.retailStores) prev.retailStores.forEach(function(s){psMap[s.name]=s;});
  if(!sorted.length) { document.getElementById('retailTbody').innerHTML='<tr><td colspan="16" class="no-data">暂无符合条件的门店</td></tr>'; renderRetailCost(sorted,psMap); return; }
  var html='',tot={labor:0,fixed:0,perf:0,count:0,ic:0,ot:0,trv:0,soc:0,act:0,tgt:0};
  sorted.forEach(function(s){var fp=parseFloat((s.fixed/s.labor*100).toFixed(1));var r=s.orders_actual!=null&&s.orders_target>0?s.orders_actual/s.orders_target:null;var eff=s.count>0&&s.orders_actual!=null?(s.orders_actual/s.count).toFixed(2):'-';var cps=s.orders_actual>0?Math.round(s.labor/s.orders_actual):null;var af=s.count>0?fmt(Math.round(s.fixed/s.count)):'-';var ap=s.count>0?fmt(Math.round(s.perf/s.count)):'-';var bg=s.dept==='江西一部'?'#f0f7f7':'#f6f9f6';var ps=psMap[s.name];var mc=ps?momBadge(s.labor,ps.labor):'<span style="color:var(--gray);font-size:10px">—</span>';tot.labor+=s.labor;tot.fixed+=s.fixed;tot.perf+=s.perf;tot.count+=s.count;tot.ic+=s.intern_count||0;tot.ot+=s.overtime_legal||0;tot.trv+=s.travel||0;tot.soc+=s.social||0;if(s.orders_actual!=null){tot.act+=s.orders_actual;tot.tgt+=s.orders_target;}html+='<tr style="background:'+bg+'"><td title="'+s.name+'">'+s.name.replace('零售中心','').replace('（外展店）','<small style="color:var(--gray)">外展</small>')+'</td><td style="color:var(--gray)">'+s.dept+'</td><td>'+(s.intern_count?'<strong>'+s.count+'</strong><span title="含'+s.intern_count+'名实习生成本" class="intern-tag">(+'+s.intern_count+'习)</span>':'<strong>'+s.count+'</strong>')+'</td><td>'+fmt(s.labor)+'</td><td>'+mc+'</td><td style="color:var(--fixed-color)">'+fmt(s.fixed)+'</td><td style="color:var(--perf-color)">'+fmt(s.perf)+'</td><td>'+fixedBadge(fp)+'</td><td style="color:var(--fixed-color)">'+af+'</td><td style="color:var(--perf-color)">'+ap+'</td><td><strong>'+(s.orders_actual!=null?s.orders_actual:'-')+'</strong></td><td>'+(s.orders_target!=null?s.orders_target:'-')+'</td><td>'+(r!=null?'<span class="'+rateClass(r)+'">'+(r*100).toFixed(1)+'%</span>':'<span style="color:var(--gray)">—</span>')+'</td><td>'+(s.count>0?fmt(Math.round(s.labor/s.count)):'-')+'</td><td>'+eff+'</td><td>'+(cps?fmt(cps):'-')+'</td></tr>';});
  if(sorted.length>1){var tfp=parseFloat((tot.fixed/tot.labor*100).toFixed(1));var tr=tot.tgt>0?tot.act/tot.tgt:null;html+='<tr class="total-row"><td colspan="2">筛选合计（'+sorted.length+'家）</td><td>'+tot.count+(tot.ic?'<span title="含'+tot.ic+'名实习生成本" class="intern-tag">(+'+tot.ic+'习)</span>':'')+'</td><td>'+fmt(tot.labor)+'</td><td>—</td><td>'+fmt(tot.fixed)+'</td><td>'+fmt(tot.perf)+'</td><td>'+fixedBadge(tfp)+'</td><td>'+(tot.count>0?fmt(Math.round(tot.fixed/tot.count)):'-')+'</td><td>'+(tot.count>0?fmt(Math.round(tot.perf/tot.count)):'-')+'</td><td><strong>'+tot.act+'</strong></td><td>'+tot.tgt+'</td><td>'+(tr!=null?'<span class="'+rateClass(tr)+'">'+(tr*100).toFixed(1)+'%</span>':'—')+'</td><td>'+(tot.count>0?fmt(Math.round(tot.labor/tot.count)):'-')+'</td><td>'+(tot.count>0&&tot.act>0?(tot.act/tot.count).toFixed(2):'-')+'</td><td>'+(tot.act>0?fmt(Math.round(tot.labor/tot.act)):'-')+'</td></tr>';}
  document.getElementById('retailTbody').innerHTML=html;
  renderRetailCost(sorted, psMap);
}

function renderRetailCost(arr, pm) {
  var html='',tot={ot:0,trv:0,soc:0,count:0};
  arr.forEach(function(s){
    var p=pm[s.name];
    var mot=p?momBadge(s.overtime_legal||0,p.overtime_legal||0):'<span style="color:var(--gray);font-size:10px">—</span>';
    var mtr=p?momBadge(s.travel||0,p.travel||0):'<span style="color:var(--gray);font-size:10px">—</span>';
    var ms=p?momBadge(s.social||0,p.social||0):'<span style="color:var(--gray);font-size:10px">—</span>';
    tot.ot+=s.overtime_legal||0;tot.trv+=s.travel||0;tot.soc+=s.social||0;tot.count+=s.count||0;
    html+='<tr><td title="'+s.name+'">'+s.name.replace('零售中心','').replace('（外展店）','<small style="color:var(--gray)">外展</small>')+'</td><td style="color:var(--gray)">'+(s.dept||'')+'</td><td>'+(s.count||0)+'</td><td>'+fmt(s.overtime_legal||0)+'</td><td>'+mot+'</td><td>'+fmt(s.travel||0)+'</td><td>'+mtr+'</td><td>'+fmt(s.social||0)+'</td><td>'+ms+'</td></tr>';
  });
  if(arr.length>1) html+='<tr class="total-row"><td colspan="2">合计（'+arr.length+'家）</td><td>'+tot.count+'</td><td>'+fmt(tot.ot)+'</td><td>—</td><td>'+fmt(tot.trv)+'</td><td>—</td><td>'+fmt(tot.soc)+'</td><td>—</td></tr>';
  document.getElementById('costTbody').innerHTML=html;
}

  var ws=XLSX.utils.aoa_to_sheet([hd].concat(dr));ws['!cols']=[22,12,6,14,12,12,8,12,12,8,12,12,8,8,8,12,10,10].map(function(w){return{wch:w};});
  addExportHeaderStyle(ws);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'零售门店数据');
  XLSX.writeFile(wb,'零售门店数据_'+(getData().period)+'_离线版.xlsx');showToast('已导出 '+arr.length+' 家门店数据');
}
function exportCostTable() {
  var arr=getRetailData();var prev=getPrevData();var pm={};if(prev&&prev.retailStores)prev.retailStores.forEach(function(s){pm[s.name]=s;});
  var hd=['门店','所属部门','在编人数','法定加班','上月法定加班','法定加班环比(%)','出差津贴','上月出差津贴','出差津贴环比(%)','社保公积金(企)','上月社保','社保环比(%)'];
  var dr=arr.map(function(s){var p=pm[s.name];return [s.name,s.dept,s.count,s.overtime_legal||0,p?p.overtime_legal||0:null,p?parseFloat(((s.overtime_legal||0)-(p.overtime_legal||0))/(p.overtime_legal||1)*100).toFixed(1):null,s.travel||0,p?p.travel||0:null,p?parseFloat(((s.travel||0)-(p.travel||0))/(p.travel||1)*100).toFixed(1):null,s.social||0,p?p.social||0:null,p?parseFloat(((s.social||0)-(p.social||0))/(p.social||1)*100).toFixed(1):null];});
  var to=arr.reduce(function(a,s){a.ot+=s.overtime_legal||0;a.trv+=s.travel||0;a.soc+=s.social||0;a.count+=s.count||0;return a;},{ot:0,trv:0,soc:0,count:0});
  dr.push(['合计（'+arr.length+'家）','',to.count,to.ot,'','',to.trv,'','',to.soc,'','']);
  var ws=XLSX.utils.aoa_to_sheet([hd].concat(dr));ws['!cols']=[22,12,6,12,12,10,10,10,10,14,12,10].map(function(w){return{wch:w};});
  addExportHeaderStyle(ws);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'补充成本明细');
  XLSX.writeFile(wb,'补充成本明细_'+(getData().period)+'_离线版.xlsx');showToast('已导出 '+arr.length+' 家门店补充成本数据');
}

// ======= PERSONNEL =======
var ALLOWED_TITLES = ['产品专家','产品专员','储备管理','高级产品专家','资深产品专家','零售主管'];
var _personnelSort = {col:'',dir:1};
function personnelSortBy(col){if(_personnelSort.col===col)_personnelSort.dir*=-1;else{_personnelSort.col=col;_personnelSort.dir=1;}document.querySelectorAll('.sort-indicator').forEach(function(el){el.classList.remove('active');el.textContent='';});['','2'].forEach(function(sfx){var ind=document.getElementById('pSort-'+col+sfx);if(ind){ind.classList.add('active');ind.textContent=_personnelSort.dir===1?'▲':'▼';}});renderPersonnel();}

function pGetMsSelected(){return[...document.querySelectorAll('#pMsList input[type=checkbox]:checked')].map(function(cb){return cb.value;});}
function pMsSyncLabel(){var s=pGetMsSelected(),l=document.getElementById('pMsLabel');if(!s.length)l.textContent='全部门店';else if(s.length===1)l.textContent=s[0];else l.innerHTML='已选 <span class="ms-count-badge">'+s.length+'</span> 家门店';}
function pMsSyncSelectAll(){var a=document.querySelectorAll('#pMsList input'),c=document.querySelectorAll('#pMsList input:checked'),sa=document.getElementById('pMsSelectAll');sa.indeterminate=c.length>0&&c.length<a.length;sa.checked=a.length>0&&c.length===a.length;}
function pToggleMsPanel(){var p=document.getElementById('pMsPanel'),t=document.getElementById('pMsTrigger'),o=p.classList.toggle('open');t.classList.toggle('open',o);if(o){document.getElementById('pMsSearch').value='';pFilterMsOptions('');}}
function pCloseMsPanel(){document.getElementById('pMsPanel').classList.remove('open');document.getElementById('pMsTrigger').classList.remove('open');}
function pFilterMsOptions(q){q=q.toLowerCase();document.querySelectorAll('#pMsList .ms-item').forEach(function(i){i.style.display=!q||i.dataset.name.toLowerCase().includes(q)?'':'none';});}
function pMsToggleAll(cb){document.querySelectorAll('#pMsList input').forEach(function(c){c.checked=cb.checked;});pMsSyncLabel();pPopulateTitleDropdown();renderPersonnel();}
function pPopulateStoreDropdown(){var dept=document.getElementById('pFilterDept').value;var emps=getData().employees||[];var stores=emps.filter(function(e){if(e.isIntern===true)return false;if(!e.name)return false;if(dept&&e.dept!==dept)return false;return true;}).map(function(e){return e.store;}).filter(function(v,i,a){return v&&a.indexOf(v)===i;}).sort(function(a,b){return a.localeCompare(b,'zh');});var prev=pGetMsSelected().filter(function(n){return stores.includes(n);});document.getElementById('pMsList').innerHTML=stores.map(function(n){return '<label class="ms-item" data-name="'+n+'"><input type="checkbox" value="'+n+'" onchange="pMsSyncLabel();pMsSyncSelectAll();pPopulateTitleDropdown();renderPersonnel()"'+(prev.includes(n)?' checked':'')+'> '+n+'</label>';}).join('');pMsSyncLabel();pMsSyncSelectAll();}

function pGetTitleMsSelected(){return[...document.querySelectorAll('#pTitleMsList input[type=checkbox]:checked')].map(function(cb){return cb.value;});}
function pTitleMsSyncLabel(){var s=pGetTitleMsSelected(),l=document.getElementById('pTitleMsLabel');if(!s.length)l.textContent='全部岗位';else if(s.length===1)l.textContent=s[0];else l.innerHTML='已选 <span class="ms-count-badge">'+s.length+'</span> 个岗位';}
function pTitleMsSyncSelectAll(){var a=document.querySelectorAll('#pTitleMsList input'),c=document.querySelectorAll('#pTitleMsList input:checked'),sa=document.getElementById('pTitleMsSelectAll');sa.indeterminate=c.length>0&&c.length<a.length;sa.checked=a.length>0&&c.length===a.length;}
function pToggleTitleMsPanel(){var p=document.getElementById('pTitleMsPanel'),t=document.getElementById('pTitleMsTrigger'),o=p.classList.toggle('open');t.classList.toggle('open',o);if(o){document.getElementById('pTitleMsSearch').value='';pFilterTitleMsOptions('');}}
function pCloseTitleMsPanel(){document.getElementById('pTitleMsPanel').classList.remove('open');document.getElementById('pTitleMsTrigger').classList.remove('open');}
function pFilterTitleMsOptions(q){q=q.toLowerCase();document.querySelectorAll('#pTitleMsList .ms-item').forEach(function(i){i.style.display=!q||i.dataset.name.toLowerCase().includes(q)?'':'none';});}
function pTitleMsToggleAll(cb){document.querySelectorAll('#pTitleMsList input').forEach(function(c){c.checked=cb.checked;});pTitleMsSyncLabel();renderPersonnel();}
function pPopulateTitleDropdown(){var dept=document.getElementById('pFilterDept').value;var stores=pGetMsSelected();var emps=getData().employees||[];var titles=emps.filter(function(e){if(e.isIntern===true)return false;if(!e.name)return false;if(dept&&e.dept!==dept)return false;if(stores.length&&!stores.includes(e.store))return false;return e.title&&ALLOWED_TITLES.includes(e.title);}).map(function(e){return e.title;}).filter(function(v,i,a){return v&&a.indexOf(v)===i;}).sort(function(a,b){return a.localeCompare(b,'zh');});var prev=pGetTitleMsSelected().filter(function(n){return titles.includes(n);});document.getElementById('pTitleMsList').innerHTML=titles.map(function(n){return '<label class="ms-item" data-name="'+n+'"><input type="checkbox" value="'+n+'" onchange="pTitleMsSyncLabel();pTitleMsSyncSelectAll();renderPersonnel()"'+(prev.includes(n)?' checked':'')+'> '+n+'</label>';}).join('');pTitleMsSyncLabel();pTitleMsSyncSelectAll();}
function popPersonnelDeptChange(){pPopulateStoreDropdown();pPopulateTitleDropdown();renderPersonnel();}
function clearPersonnelFilters(){document.getElementById('pFilterDept').value='';document.getElementById('pMsList').innerHTML='';document.querySelectorAll('#pMsList input').forEach(function(c){c.checked=false;});pMsSyncLabel();pMsSyncSelectAll();document.getElementById('pTitleMsList').innerHTML='';document.querySelectorAll('#pTitleMsList input').forEach(function(c){c.checked=false;});pTitleMsSyncLabel();pTitleMsSyncSelectAll();pPopulateStoreDropdown();pPopulateTitleDropdown();renderPersonnel();}

function renderPersonnel() {
  var emps = getData().employees||[];
  if(!emps.length){document.getElementById('pCountInfo').textContent='暂无数据';document.getElementById('personnelQuadrantSummary').innerHTML='';destroyChart('chartPersonnel');return;}
  var deptFilter=document.getElementById('pFilterDept');
  var depts=[...new Set(emps.filter(function(e){return e.dept;}).map(function(e){return e.dept;}))].sort(function(a,b){return a.localeCompare(b,'zh');});
  deptFilter.innerHTML='<option value="">全部</option>'+depts.map(function(d){return '<option value="'+d+'">'+d+'</option>';}).join('');
  pPopulateStoreDropdown();pPopulateTitleDropdown();
  var sd=deptFilter.value,ss=pGetMsSelected(),st=pGetTitleMsSelected();
  var htd=emps.some(function(e){return e.title;});
  var filtered=emps.filter(function(e){if(e.isIntern===true)return false;if(!e.name)return false;if(sd&&e.dept!==sd)return false;if(ss.length&&!ss.includes(e.store))return false;if(st.length){if(!st.includes(e.title))return false;}else{if(htd&&(!e.title||!ALLOWED_TITLES.includes(e.title)))return false;}return true;});
  document.getElementById('pCountInfo').textContent='共 '+filtered.length+' 人';
  var pts=filtered.map(function(e){return{id:e.id,name:e.name,title:e.title||'',store:e.store,dept:e.dept,cat:e.cat,x:e.labor||0,y:typeof e.orders==='number'?e.orders:0};});
  if(_personnelSort.col){var sc=_personnelSort.col,dir=_personnelSort.dir;pts.sort(function(a,b){var va,vb;if(sc==='labor'){va=a.x;vb=b.x;}else if(sc==='orders'){va=a.y;vb=b.y;}else if(sc==='quadrant'){va=a.q||0;vb=b.q||0;}else{va=(a[sc]||'').toString();vb=(b[sc]||'').toString();}if(typeof va==='number')return(va-vb)*dir;return va.localeCompare(vb,'zh')*dir;});}else{pts.sort(function(a,b){return(a.store||'').localeCompare(b.store||'')||a.name.localeCompare(b.name);});}
  var vp=pts.filter(function(p){return p.x>0;});destroyChart('chartPersonnel');
  if(vp.length){
    var mx=median(vp.map(function(d){return d.x;})),my=median(vp.map(function(d){return d.y;}));
    vp.forEach(function(d){var hc=d.x>mx,ho=d.y>my;d.q=hc?(ho?2:4):(ho?1:3);});
    var Q={1:{label:'低成本·高定单',bg:'rgba(0,114,109,0.55)',border:'#00726D',ab:'rgba(0,114,109,0.06)'},2:{label:'高成本·高定单',bg:'rgba(206,164,114,0.75)',border:'#b07030',ab:'rgba(206,164,114,0.08)'},3:{label:'低成本·低定单',bg:'rgba(82,120,160,0.55)',border:'#5278A0',ab:'rgba(82,120,160,0.06)'},4:{label:'高成本·低定单',bg:'rgba(220,38,38,0.6)',border:'#dc2626',ab:'rgba(220,38,38,0.07)'}};
    var pp={id:'p',afterDraw:function(ch){var c=ch.ctx,l=ch.chartArea.left,r=ch.chartArea.right,t=ch.chartArea.top,b=ch.chartArea.bottom,x=ch.scales.x,y=ch.scales.y,px=x.getPixelForValue(mx),py=y.getPixelForValue(my);c.save();[[l,t,px-l,py-t,1],[px,t,r-px,py-t,2],[l,py,px-l,b-py,3],[px,py,r-px,b-py,4]].forEach(function(a){c.fillStyle=Q[a[4]].ab;c.fillRect(a[0],a[1],a[2],a[3]);});c.strokeStyle='#bbb';c.lineWidth=1;c.setLineDash([5,4]);c.beginPath();c.moveTo(px,t);c.lineTo(px,b);c.stroke();c.beginPath();c.moveTo(l,py);c.lineTo(r,py);c.stroke();c.setLineDash([]);c.font='10px sans-serif';c.fillStyle='#999';c.textAlign='center';c.fillText('中位 '+fmt(mx)+'元',px,b+22);c.textAlign='right';c.fillText('中位 '+my+'单',l-4,py+4);c.font='bold 10px PingFang SC,sans-serif';[[Q[1].label,l+5,t+13,'left','rgba(0,114,109,0.75)'],[Q[2].label,r-5,t+13,'right','rgba(160,100,30,0.75)'],[Q[3].label,l+5,b-6,'left','rgba(60,100,150,0.65)'],[Q[4].label,r-5,b-6,'right','rgba(180,30,30,0.75)']].forEach(function(a){c.fillStyle=a[4];c.textAlign=a[3];c.fillText(a[0],a[1],a[2]);});c.restore();}};
    charts.chartPersonnel=new Chart(document.getElementById('chartPersonnel'),{type:'bubble',data:{datasets:[1,2,3,4].map(function(q){return{label:Q[q].label,data:vp.filter(function(d){return d.q===q;}).map(function(d){return{x:d.x,y:d.y,r:8};}),backgroundColor:Q[q].bg,borderColor:Q[q].border,borderWidth:1.5};})},plugins:[pp],options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top',labels:{boxWidth:10,font:{size:11},padding:12}},tooltip:{callbacks:{label:function(ctx){var d=vp.filter(function(v){return v.x===ctx.raw.x&&v.y===ctx.raw.y;})[0];return (d?d.name:'')+' | '+(d?d.title:'')+' | '+(d?d.store:'')+' | 成本 '+fmt(ctx.raw.x)+'元 | 定单 '+ctx.raw.y+'单';}}}},scales:{x:{title:{display:true,text:'个人成本（元）',font:{size:10}},ticks:{callback:function(v){return fmt(v);}}},y:{title:{display:true,text:'个人定单量（单）',font:{size:10}},beginAtZero:true}}}});
    var defs=[{q:1,ic:'⭐',ti:'优秀员工 · 低成本高定单',de:'成本控制好且产出突出，是当前的标杆员工，可作经验推广。',co:'#00726D',bg:'rgba(0,114,109,0.06)',bo:'rgba(0,114,109,0.2)'},{q:2,ic:'📈',ti:'核心骨干 · 高成本高定单',de:'产出出色但成本偏高，建议深挖成本结构，优化薪酬配置。',co:'#9a6c20',bg:'rgba(206,164,114,0.1)',bo:'rgba(180,130,50,0.35)'},{q:3,ic:'⚡',ti:'潜力新人 · 低成本低定单',de:'成本可控但单量不足，建议加强培训和订单获取能力。',co:'#3a6898',bg:'rgba(82,120,160,0.07)',bo:'rgba(82,120,160,0.25)'},{q:4,ic:'⚠️',ti:'需关注 · 高成本低定单',de:'高投入低产出，需重点排查，优先制定改善或汰换方案。',co:'#dc2626',bg:'rgba(220,38,38,0.06)',bo:'rgba(220,38,38,0.2)'}];
    document.getElementById('personnelQuadrantSummary').innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">'+defs.map(function(d){var ppl=vp.filter(function(s){return s.q===d.q;});var tags=ppl.length?ppl.map(function(s){return '<span style="background:'+d.bg+';border:1px solid '+d.bo+';padding:2px 8px;border-radius:10px;font-size:11px;white-space:nowrap;color:'+d.co+'">'+s.name+'('+s.y+'单/'+fmt(s.x)+'元)</span>';}).join(' '):'<span style="color:#aaa;font-size:11px">暂无员工</span>';return '<div style="background:'+d.bg+';border:1px solid '+d.bo+';border-radius:8px;padding:12px 14px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:5px"><span style="font-size:15px">'+d.ic+'</span><span style="font-weight:700;font-size:13px;color:'+d.co+'">'+d.ti+'</span><span style="margin-left:auto;background:'+d.co+';color:#fff;border-radius:10px;padding:1px 9px;font-size:11px;font-weight:700">'+ppl.length+'人</span></div><div style="font-size:11px;color:#555;margin-bottom:8px;line-height:1.5">'+d.de+'</div><div>'+tags+'</div></div>';}).join('')+'</div>';
  } else {
    document.getElementById('personnelQuadrantSummary').innerHTML='';
  }
}
