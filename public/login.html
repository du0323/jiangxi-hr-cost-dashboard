<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人力成本分析看板 · 登录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#002D28 0%,#00726D 100%);
  font-family:'PingFang SC','Microsoft YaHei',sans-serif}
.card{background:#fff;border-radius:16px;padding:44px 40px 36px;width:380px;
  box-shadow:0 24px 64px rgba(0,0,0,.25)}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{width:52px;height:52px;background:linear-gradient(135deg,#002D28,#00726D);
  border-radius:14px;display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:12px}
.logo-icon svg{width:28px;height:28px;color:#fff}
.logo h1{font-size:18px;font-weight:700;color:#002D28;letter-spacing:.3px}
.logo p{font-size:12px;color:#666;margin-top:4px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:#333;margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border:1.5px solid #c8d8d6;border-radius:8px;
  font-size:14px;outline:none;transition:border-color .15s;color:#333}
.field input:focus{border-color:#00726D}
.btn{width:100%;padding:12px;border-radius:8px;border:none;
  background:linear-gradient(135deg,#002D28,#00726D);color:#fff;
  font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{background:#fee2e2;color:#dc2626;font-size:12px;padding:8px 12px;
  border-radius:6px;margin-top:12px;display:none}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#999}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
    </div>
    <h1 id="loginTitle">人力成本分析</h1>
    <p>请登录以访问看板</p>
  </div>
  <div class="field">
    <label>用户名</label>
    <input id="username" type="text" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="field">
    <label>密码</label>
    <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
  <div class="error" id="errMsg"></div>
  <div class="footer">如需账号请联系管理员</div>
</div>
<script>
fetch('/api/config').then(r=>r.ok?r.json():Promise.resolve({zoneName:'江西战区'})).then(cfg=>{
  const zn = cfg.zoneName || '人力成本';
  document.getElementById('loginTitle').textContent = zn + '人力成本分析';
  document.title = zn + '人力成本分析';
}).catch(()=>{});
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { showErr('请输入用户名和密码'); return; }
  btn.disabled = true; btn.textContent = '登录中…';
  err.style.display = 'none';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();
    if (r.ok) { window.location.href = '/'; }
    else { showErr(d.error || '登录失败'); }
  } catch(e) { showErr('网络错误，请重试'); }
  finally { btn.disabled = false; btn.textContent = '登 录'; }
}
function showErr(msg) {
  const e = document.getElementById('errMsg');
  e.textContent = msg; e.style.display = 'block';
}
</script>
</body>
</html>
